name: Deploy to Production

on:
  push:
    branches:
      - oss

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set app name without organization
        run: echo "APP_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | cut -d'/' -f2)" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_NAME }}:latest
            ghcr.io/${{ env.REPO_NAME }}:${{ github.sha }}

      - name: Update image tag in infra repo
        run: |
          git clone https://x-access-token:${{ secrets.INFRA_REPO_TOKEN }}@github.com/IntroSecretProject/infra-k3s.git
          cd infra-k3s
          sed -i "s|ghcr.io/${{ env.REPO_NAME }}:.*|ghcr.io/${{ env.REPO_NAME }}:${{ github.sha }}|g" apps/${{ env.APP_NAME }}/deployment.yaml
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add apps/${{ env.APP_NAME }}/deployment.yaml
          git commit -m "Update ${{ env.APP_NAME }} image to ${{ github.sha }}"
          git push
